# Stamps version.json with the latest commit so open copies of The Home know to update themselves.
name: Version stamp

on:
  push:
    branches: [main]
    paths-ignore: ['models/**', 'designs/**', 'version.json', '**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write version.json
        run: |
          echo "{ \"sha\": \"${GITHUB_SHA::10}\", \"at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" }" > version.json
          git config user.name "the-home-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "🔖 Stamp version ${GITHUB_SHA::10} [skip ci]" || exit 0
          git pull --rebase -q || true
          git push
